<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#dfe9f2">
    <title>Mistakery</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="cards.bundle.js" defer></script>
    <script src="game.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app" data-app>
      <section class="phone" data-game aria-label="Mistakery game">
        <header class="topbar">
          <h1>Mistakery</h1>
          <button class="turn" type="button" data-restart-run>Back to 9-5</button>
        </header>

        <section class="resources" data-resources aria-label="Startup resources"></section>

        <section class="intro" data-intro hidden aria-label="Intro">
          <article class="messenger" data-intro-messenger>
            <header class="threadbar">
              <div class="avatar" data-intro-avatar aria-hidden="true">M</div>
              <div class="threadbar__copy">
                <strong data-intro-name>Mistakery</strong>
                <span data-intro-status></span>
              </div>
              <span class="threadbar__menu" aria-hidden="true">•••</span>
            </header>

            <section class="conversation conversation--intro" data-intro-conversation aria-live="polite"></section>

            <footer class="reply-dock">
              <div class="composer">
                <span>Choose a reply…</span>
                <span aria-hidden="true">↑</span>
              </div>
              <div class="choices" data-intro-choices></div>
            </footer>
          </article>
        </section>

        <article class="messenger" data-messenger>
          <header class="threadbar">
            <div class="avatar" data-avatar aria-hidden="true">B</div>
            <div class="threadbar__copy">
              <strong data-sender>Loading…</strong>
              <span data-status>typing...</span>
            </div>
            <span class="threadbar__menu" aria-hidden="true">•••</span>
          </header>

          <section class="conversation" data-conversation aria-live="polite">
            <button class="pinned" type="button" data-pinned hidden>
              <span class="pinned__pin" aria-hidden="true">📌</span>
              <span class="pinned__title" data-pinned-title></span>
            </button>
            <div class="message-row">
              <div class="message-avatar" data-message-avatar aria-hidden="true">B</div>
              <div class="bubble">
                <p data-message>Opening the founder chat…</p>
                <span class="stamp">15:54</span>
              </div>
            </div>
          </section>

          <footer class="reply-dock" data-reply-dock>
            <div class="composer">
              <span>Choose a reply…</span>
              <span aria-hidden="true">↑</span>
            </div>
            <div class="choices" data-choices></div>
          </footer>
        </article>

        <div class="pin-sheet" data-pin-sheet hidden>
          <div class="pin-sheet__card" role="dialog" aria-label="Pinned message">
            <header class="pin-sheet__head">
              <span>📌 Pinned</span>
              <button class="pin-sheet__close" type="button" data-pin-close aria-label="Close">✕</button>
            </header>
            <div class="bubble"><p data-pin-text></p></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
